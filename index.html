<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FindEat — Primeurs & Producteurs Locaux</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f2f2f7;--card:#fff;--surface:rgba(255,255,255,.92);--green:#1e3a2f;--accent:#2e7d32;--soft:#e8f0ea;--red:#d3543a;--ink:#1c1c1e;--muted:#8e8e93;--line:rgba(60,60,67,.12);--r:18px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:var(--font);background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}button,input{font:inherit;border:0;outline:0}button{cursor:pointer;transition:.15s}button:active{transform:scale(.97)}
.topbar{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;background:var(--surface);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);z-index:1000}.brand{display:flex;align-items:center;gap:10px}.brand-icon{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--green),#0f201a);display:grid;place-items:center;font-size:22px;box-shadow:0 4px 10px #1e3a2f33}.brand h1{font-size:19px;color:var(--green);line-height:1.1}.brand p{font-size:12px;color:var(--muted);margin-top:2px}.header-actions{display:flex;align-items:center;gap:12px;flex:1;justify-content:flex-end;max-width:640px}.search-wrapper{position:relative;flex:1}.search-input{width:100%;height:46px;padding:0 40px 0 42px;background:#7676801f;border-radius:12px;font-size:14px}.search-input:focus{background:#fff;box-shadow:0 0 0 3px #1e3a2f26}.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}.locate-btn,.add-btn{height:46px;padding:0 16px;border-radius:12px;background:var(--green);color:#fff;font-weight:600;white-space:nowrap;box-shadow:0 4px 12px #1e3a2f2e}.suggestions-dropdown{position:absolute;top:52px;left:0;right:0;background:#fffffff7;border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 36px #1e3a2f24;padding:6px;display:none;z-index:1200}.suggestions-dropdown.open{display:block}.suggestion-item{display:flex;gap:10px;width:100%;padding:10px 12px;background:transparent;border-radius:10px;text-align:left;font-size:13px}.suggestion-item:hover{background:var(--soft)}.suggestion-item strong,.suggestion-item small{display:block}.suggestion-item small{color:var(--muted);font-size:11px}
.app-layout{flex:1;display:grid;grid-template-columns:1.15fr .85fr;overflow:hidden}.map-container,#map{width:100%;height:100%}.map-container{background:#e5e3df}.sidebar{background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;height:100%;overflow:hidden}.filters-section{padding:16px 20px 12px;background:var(--surface);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.quick-cities{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}.quick-cities::-webkit-scrollbar{display:none}.city-chip{padding:6px 12px;border-radius:14px;background:#7676801a;font-size:12px;font-weight:600;white-space:nowrap}.city-chip.active,.city-chip:hover{background:var(--green);color:#fff}.shelf-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.shelf-header h2{font-size:16px}.results-badge{font-size:12px;color:var(--green);background:var(--soft);padding:3px 9px;border-radius:12px}.budget-labels{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:6px}.budget-labels span{color:var(--muted)}.budget-labels strong{color:var(--red);font-size:14px}.budget-slider-box{margin-bottom:12px}input[type=range]{appearance:none;width:100%;background:transparent}input[type=range]::-webkit-slider-runnable-track{height:6px;background:#e5e5ea;border-radius:3px}input[type=range]::-webkit-slider-thumb{appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 3px 8px #0003}.segmented-control{display:flex;background:#e5e5ea;padding:2px;border-radius:10px}.segment-btn{flex:1;padding:7px 0;background:transparent;color:var(--muted);font-size:12px;border-radius:8px}.segment-btn.active{background:#fff;color:var(--ink);box-shadow:0 2px 6px #0002}.cards-flow{flex:1;overflow-y:auto;padding:14px 18px 24px;display:flex;flex-direction:column;gap:12px}.store-card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 2px 8px #0000000a;border:1.5px solid transparent;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;cursor:pointer;transition:.2s}.store-card:hover{box-shadow:0 8px 24px #00000014;transform:translateY(-1px)}.store-card.selected{border-color:var(--green);box-shadow:0 16px 36px #1e3a2f24}.store-avatar{width:52px;height:52px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:24px}.store-info h3{font-size:15px;margin-bottom:2px}.store-sub{font-size:12px;color:var(--muted);margin-bottom:6px}.tags-container{display:flex;flex-wrap:wrap;gap:4px}.tag-badge{font-size:10px;font-weight:600;color:var(--green);background:var(--soft);padding:3px 6px;border-radius:6px}.store-pricing{text-align:right}.price-value{font-size:14px;font-weight:800;color:var(--red)}.open-status{font-size:10px;font-weight:700;color:var(--accent);margin-top:4px}.add-store-banner{background:linear-gradient(135deg,#fff,var(--soft));border:1px dashed #1e3a2f59;border-radius:var(--r);padding:16px;margin-top:6px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}.banner-text h4{font-size:14px;color:var(--green);margin-bottom:2px}.banner-text p{font-size:12px;color:var(--muted)}.add-btn{width:100%;height:42px}.pin-badge{background:#fff;color:var(--ink);font-weight:700;font-size:12px;padding:5px 9px;border-radius:14px;border:1.5px solid #00000014;box-shadow:0 4px 10px #00000026;white-space:nowrap}.pin-badge.active,.pin-badge:hover{background:var(--green);color:#fff;transform:scale(1.12)}.pin-user{width:18px;height:18px;background:#07f;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 6px #007aff40}
.modal-overlay{position:fixed;inset:0;background:#00000059;backdrop-filter:blur(10px);z-index:2000;display:none;place-items:center;padding:16px}.modal-overlay.show{display:grid}.modal-card{width:100%;max-width:520px;max-height:90vh;overflow-y:auto;background:#fff;border-radius:24px;padding:24px;position:relative;box-shadow:0 24px 60px #0003}.close-btn{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:50%;background:#e5e5ea;color:var(--muted)}.hours-table{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px;margin:14px 0;padding:12px;background:var(--bg);border-radius:12px}.form-group{margin-bottom:14px}.form-group label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.form-control{width:100%;height:44px;padding:0 14px;background:#7676801a;border-radius:12px;font-size:14px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.empty-state{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
@media(max-width:860px){body{height:100%;overflow:auto}.topbar{flex-direction:column;align-items:stretch;padding:14px 16px;gap:12px}.header-actions{width:100%;max-width:none;gap:8px}.search-input,.locate-btn{height:48px}.app-layout{display:flex;flex-direction:column;height:auto}.map-container{height:46vh;min-height:290px}.sidebar{height:54vh;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="brand-icon">🍏</div><div><h1>FindEat</h1><p>Trouvez votre primeur en un clin d’œil !</p></div></div><div class="header-actions"><div class="search-wrapper"><span class="search-icon">🔍</span><input id="searchInput" class="search-input" placeholder="Rechercher une ville en France…" autocomplete="off"><div id="suggestionsBox" class="suggestions-dropdown"></div></div><button id="locateBtn" class="locate-btn">📍 Me localiser</button></div></header>
<main class="app-layout"><div class="map-container"><div id="map"></div></div><aside class="sidebar"><section class="filters-section"><div class="quick-cities"><button class="city-chip active" data-lat="48.8566" data-lon="2.3522" data-name="Paris">📍 Paris</button><button class="city-chip" data-lat="45.764" data-lon="4.8357" data-name="Lyon">📍 Lyon</button><button class="city-chip" data-lat="44.8378" data-lon="-0.5792" data-name="Bordeaux">📍 Bordeaux</button><button class="city-chip" data-lat="43.2965" data-lon="5.3698" data-name="Marseille">📍 Marseille</button><button class="city-chip" data-lat="47.2184" data-lon="-1.5536" data-name="Nantes">📍 Nantes</button><button class="city-chip" data-lat="50.6292" data-lon="3.0573" data-name="Lille">📍 Lille</button></div><div class="shelf-header"><h2>Producteurs aux alentours</h2><span id="resultsCount" class="results-badge"></span></div><div class="budget-slider-box"><div class="budget-labels"><span>Budget max (panier moyen)</span><strong id="budgetValue">50 €</strong></div><input id="budgetSlider" type="range" min="10" max="100" value="50" step="5"></div><div class="segmented-control"><button class="segment-btn active" data-radius="5">5 km</button><button class="segment-btn" data-radius="10">10 km</button><button class="segment-btn" data-radius="15">15 km</button><button class="segment-btn" data-radius="20">20 km</button><button class="segment-btn" data-radius="999">Tout</button></div></section><div id="cardsList" class="cards-flow"></div></aside></main>
<div id="modalOverlay" class="modal-overlay"><div class="modal-card"><button id="closeModal" class="close-btn">✕</button><h2 id="modalTitle" style="color:var(--green);margin-bottom:4px"></h2><p id="modalSub" style="font-size:13px;color:var(--muted)"></p><strong style="display:block;margin-top:14px;font-size:13px">Horaires d'ouverture</strong><div id="modalHoursTable" class="hours-table"></div><strong style="display:block;font-size:13px;margin-bottom:8px">Arrivages de la saison & produits</strong><div id="modalTags" class="tags-container" style="margin-bottom:20px"></div><a id="modalTel" style="display:block;text-align:center;background:var(--green);color:white;padding:13px;border-radius:12px;font-weight:600;text-decoration:none"></a></div></div>
<div id="addModalOverlay" class="modal-overlay"><div class="modal-card"><button id="closeAddModal" class="close-btn">✕</button><h2 style="color:var(--green);margin-bottom:4px">Ajouter un producteur</h2><p style="font-size:12px;color:var(--muted);margin-bottom:16px">Partagez votre bon plan local pour enrichir la carte FindEat.</p><form id="addStoreForm"><div class="form-group"><label for="storeName">Nom du primeur / de la ferme *</label><input class="form-control" id="storeName" required placeholder="Ex. Le Verger de Céline"></div><div class="form-row"><div class="form-group"><label for="storeDistance">Distance estimée (km) *</label><input class="form-control" id="storeDistance" type="number" min=".1" max="50" step=".1" value="2.5" required></div><div class="form-group"><label for="storePrice">Panier moyen (€) *</label><input class="form-control" id="storePrice" type="number" min="5" max="150" value="25" required></div></div><div class="form-group"><label for="storeHours">Horaires d'ouverture / fermeture *</label><input class="form-control" id="storeHours" required placeholder="Ex. 08:30 – 19:30"></div><div class="form-group"><label for="storeTags">Produits séparés par une virgule *</label><input class="form-control" id="storeTags" required placeholder="Ex. Fraises bio, Asperges, Miel"></div><div class="form-group"><label for="storeContact">Téléphone ou Email *</label><input class="form-control" id="storeContact" required placeholder="Ex. 06 12 34 56 78"></div><button class="add-btn" type="submit">Valider et ajouter sur la carte</button></form></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{const $=id=>document.getElementById(id);let location={lat:48.8566,lon:2.3522,name:'Paris'},radius=5,budget=50,stores=[],markers=new Map(),userMarker,searchTimer;
const catalog=[['p1','Le Potager Maraîcher',48.859,2.348,'Paris 1er',28,['Pommes bio','Carottes','Fraises'],'🍎','08:30 – 19:30','01 42 68 00 12'],['p2','Au Panier de saison',48.843,2.371,'Paris 12e',22,['Salades','Radis','Légumes racines'],'🥬','09:00 – 19:00','01 43 45 22 10'],['p3','La Récolte des Buttes',48.879,2.382,'Paris 19e',34,['Paniers bio','Poires','Miel local'],'🍐','08:30 – 19:00','contact@buttes-bio.fr'],['p4','Les Vergers de Saint-Germain',48.851,2.332,'Paris 6e',42,['Agrumes','Champignons','Herbes'],'🍊','08:00 – 20:00','01 45 48 90 00'],['p5','La Ferme Montmartre',48.889,2.342,'Paris 18e',29,['Tomates cerises','Courgettes'],'🍅','09:00 – 19:30','01 46 06 11 34'],['p6','Jardins de Belleville',48.871,2.389,'Paris 20e',19,['Blettes','Courges','Épinards'],'🥦','08:30 – 18:30','01 40 33 44 55'],['ly1',"Le Maraîcher de la Presqu'île",45.761,4.834,'Lyon 2e',24,['Tomates anciennes','Basilic','Pêches'],'🍅','08:30 – 19:00','04 78 37 12 00'],['ly2',"La Source des Monts d'Or",45.782,4.819,'Lyon 9e',31,['Fromage fermier','Miel','Poires'],'🧀','09:00 – 18:30','04 78 83 45 09'],['bx1','Les Maraîchers de Garonne',44.841,-.574,'Bordeaux Centre',26,['Asperges','Cèpes','Fraises'],'🍓','08:00 – 19:00','05 56 44 23 11'],['bx2','Le Marché des Capucins',44.831,-.568,'Bordeaux Sud',21,['Raisins','Légumes bio','Prunes'],'🍇','07:00 – 14:00','05 56 92 10 00'],['mrs1','Terre de Provence',43.297,5.372,'Marseille Vieux-Port',25,['Melons','Courgettes','Figues'],'🍈','08:30 – 19:30','04 91 90 23 44'],['nt1','Le Potager Nantais',47.217,-1.554,'Nantes Centre',22,['Mâche nantaise','Poireaux','Fraises'],'🥬','08:30 – 19:00','02 40 48 55 60'],['lil1','Les Vergers des Flandres',50.635,3.061,'Lille Centre',24,['Chicons','Pommes régionales'],'🍏','08:30 – 19:30','03 20 55 12 89']].map(x=>({id:x[0],name:x[1],lat:x[2],lon:x[3],city:x[4],price:x[5],tags:x[6],emoji:x[7],hours:x[8],contact:x[9]}));
const map=L.map('map',{zoomControl:false,attributionControl:false}).setView([location.lat,location.lon],13);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(map);L.control.zoom({position:'bottomright'}).addTo(map);const distance=(a,b,c,d)=>{const r=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,z=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return r*2*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))};
function refresh(){stores=catalog.map(s=>({...s,distance:distance(location.lat,location.lon,s.lat,s.lon)})).filter(s=>s.price<=budget&&(radius>=999||s.distance<=radius)).sort((a,b)=>a.distance-b.distance);render()}
function render(){markers.forEach(m=>map.removeLayer(m));markers.clear();$('resultsCount').textContent=`${stores.length} trouvé${stores.length>1?'s':''}`;$('cardsList').innerHTML=(stores.length?stores.map(s=>`<div class="store-card" id="card-${s.id}" data-id="${s.id}"><div class="store-avatar">${s.emoji}</div><div class="store-info"><h3>${s.name}</h3><div class="store-sub">📍 ${s.city} · à ${s.distance.toFixed(1)} km</div><div class="tags-container">${s.tags.map(t=>`<span class="tag-badge">${t}</span>`).join('')}</div></div><div class="store-pricing"><div class="price-value">${s.price} €</div><div class="open-status">● Ouvert</div></div></div>`).join(''):'<div class="empty-state">🌾<br><strong>Aucun primeur avec ces critères</strong><br>Élargissez le rayon ou le budget.</div>')+`<div class="add-store-banner"><div class="banner-text"><h4>On a oublié quelqu’un ?</h4><p>Ajoutez-le en quelques clics !</p></div><button class="add-btn" id="addButton">➕ Ajouter un primeur</button></div>`;document.querySelectorAll('.store-card').forEach(c=>c.onclick=()=>select(c.dataset.id));$('addButton').onclick=()=>$('addModalOverlay').classList.add('show');stores.forEach(s=>{const icon=L.divIcon({className:'',html:`<div class="pin-badge" id="pin-${s.id}">${s.emoji} ${s.price} €</div>`,iconSize:[60,30],iconAnchor:[30,15]}),m=L.marker([s.lat,s.lon],{icon}).addTo(map);m.onclick=null;m.on('click',()=>select(s.id,true));markers.set(s.id,m)});if(userMarker)map.removeLayer(userMarker);userMarker=L.marker([location.lat,location.lon],{icon:L.divIcon({className:'',html:'<div class="pin-user"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(map)}
function select(id,fromMarker=false){const s=stores.find(x=>x.id===id);if(!s)return;document.querySelectorAll('.store-card').forEach(x=>x.classList.remove('selected'));document.querySelectorAll('.pin-badge').forEach(x=>x.classList.remove('active'));$('card-'+id)?.classList.add('selected');$('card-'+id)?.scrollIntoView({behavior:'smooth',block:'nearest'});$('pin-'+id)?.classList.add('active');if(!fromMarker)map.flyTo([s.lat,s.lon],Math.max(map.getZoom(),13),{duration:.8});$('modalTitle').textContent=`${s.emoji} ${s.name}`;$('modalSub').textContent=`${s.city} — à ${s.distance.toFixed(1)} km · Panier moyen : ${s.price} €`;$('modalHoursTable').innerHTML=`<div><strong>Lundi - Vendredi</strong></div><div>${s.hours}</div><div><strong>Samedi</strong></div><div>${s.hours}</div><div><strong>Dimanche</strong></div><div>09:00 – 12:30</div>`;$('modalTags').innerHTML=s.tags.map(t=>`<span class="tag-badge" style="font-size:12px;padding:5px 9px">${t}</span>`).join('');const phone=/^[0-9+]+$/.test(s.contact.replace(/\s/g,''));$('modalTel').href=phone?'tel:'+s.contact.replace(/\s/g,''):'mailto:'+s.contact;$('modalTel').textContent=phone?`📞 Appeler (${s.contact})`:`✉️ Écrire (${s.contact})`;$('modalOverlay').classList.add('show')}
function loadCity(lat,lon,name,button){document.querySelectorAll('.city-chip').forEach(x=>x.classList.remove('active'));button?.classList.add('active');location={lat,lon,name};$('searchInput').value=name;map.flyTo([lat,lon],13,{duration:1.2});refresh()}
document.querySelectorAll('.city-chip').forEach(b=>b.onclick=()=>loadCity(+b.dataset.lat,+b.dataset.lon,b.dataset.name,b));document.querySelectorAll('.segment-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.segment-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');radius=+b.dataset.radius;refresh()});$('budgetSlider').oninput=e=>{budget=+e.target.value;$('budgetValue').textContent=budget===100?'100+ €':budget+' €';refresh()};$('closeModal').onclick=()=>$('modalOverlay').classList.remove('show');$('closeAddModal').onclick=()=>$('addModalOverlay').classList.remove('show');document.querySelectorAll('.modal-overlay').forEach(o=>o.onclick=e=>{if(e.target===o)o.classList.remove('show')});
$('addStoreForm').onsubmit=e=>{e.preventDefault();const n=$('storeName').value.trim(),d=+$('storeDistance').value,p=+$('storePrice').value,t=$('storeTags').value.split(',').map(x=>x.trim()).filter(Boolean),h=$('storeHours').value.trim(),c=$('storeContact').value.trim(),a=Math.random()*Math.PI*2;catalog.unshift({id:'custom-'+Date.now(),name:n,lat:location.lat+d/111*Math.cos(a),lon:location.lon+d/(111*Math.cos(location.lat*Math.PI/180))*Math.sin(a),city:location.name,price:p,tags:t.length?t:['Produits frais','Local'],emoji:['🍎','🥕','🍓','🥬','🌽','🍇','🍑'][Math.floor(Math.random()*7)],hours:h,contact:c});$('addStoreForm').reset();$('addModalOverlay').classList.remove('show');if(budget<p){budget=Math.min(p,100);$('budgetSlider').value=budget;$('budgetValue').textContent=(budget===100?'100+ ':budget+' ')+'€'}refresh()};
const input=$('searchInput'),drop=$('suggestionsBox');input.oninput=e=>{const q=e.target.value.trim();if(q.length<2)return drop.classList.remove('open');clearTimeout(searchTimer);searchTimer=setTimeout(async()=>{try{const data=await (await fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(q)}&type=municipality&limit=4`)).json();drop.innerHTML='';(data.features||[]).forEach(f=>{const b=document.createElement('button');b.className='suggestion-item';b.innerHTML=`📍 <div><strong>${f.properties.name}</strong><small>${f.properties.context||''}</small></div>`;b.onclick=()=>{loadCity(f.geometry.coordinates[1],f.geometry.coordinates[0],f.properties.name,null);drop.classList.remove('open')};drop.appendChild(b)});drop.classList.toggle('open',!!data.features?.length)}catch{drop.classList.remove('open')}},150)};$('locateBtn').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>loadCity(p.coords.latitude,p.coords.longitude,'Ma Position',null),()=>alert('Activez la géolocalisation dans vos paramètres de navigateur.')):alert('Géolocalisation non supportée.');document.addEventListener('click',e=>{if(!e.target.closest('.search-wrapper'))drop.classList.remove('open')});addEventListener('resize',()=>map.invalidateSize());setTimeout(()=>map.invalidateSize(),200);refresh()})();
</script>
</body>
</html>
